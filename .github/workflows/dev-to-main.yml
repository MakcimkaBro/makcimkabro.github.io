name: Dev to Main

on:
  push:
    branches:
      - dev

jobs:
  test-and-build:
    name: 🧪 Run tests & build
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout dev branch
        uses: actions/checkout@v4
        with:
          ref: dev
      
      - name: 💎 Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      
      - name: 📦 Install dependencies
        run: bundle install
      
      - name: 🔨 Build Jekyll site
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production
      
      - name: ✅ Verify build
        run: |
          if [ ! -d "_site" ]; then
            echo "❌ Build directory _site not found!"
            exit 1
          fi
          
          if [ ! -f "_site/index.html" ]; then
            echo "❌ index.html not found!"
            exit 1
          fi
          
          echo "✅ Jekyll site built successfully"
          echo "📊 Site size: $(du -sh _site | cut -f1)"

  create-pull-request:
    name: 📝 Create PR to main
    needs: test-and-build
    runs-on: ubuntu-latest
    if: success()
    
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: 🔍 Check if PR already exists
        id: check_pr
        run: |
          PR_EXISTS=$(gh pr list --base main --head dev --state open --json number --jq length)
          echo "pr_exists=$PR_EXISTS" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: ✨ Create Pull Request
        if: steps.check_pr.outputs.pr_exists == '0'
        run: |
          gh pr create \
            --base main \
            --head dev \
            --title "🚀 Dev → Main (tests passed)" \
            --body "## ✅ All checks passed

          **Tests:** Passed ✓  
          **Build:** Successful ✓
          
          Ready to merge to production!
          
          ---
          _Automated PR from dev branch_"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: 💬 Update existing PR
        if: steps.check_pr.outputs.pr_exists != '0'
        run: |
          PR_NUMBER=$(gh pr list --base main --head dev --state open --json number --jq '.[0].number')
          gh pr comment $PR_NUMBER --body "♻️ Updated with new changes. All tests passed! ✅"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}