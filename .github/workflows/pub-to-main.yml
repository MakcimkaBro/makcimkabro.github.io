name: Siteleaf Pub to Main

on:
  push:
    branches:
      - pub

jobs:
  auto-merge-content:
    name: 📝 Auto-merge Siteleaf content
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PUB_TOKEN }}
      
      - name: ⚙️ Configure Git
        run: |
          git config user.name "Siteleaf Bot"
          git config user.email "siteleaf@automated"
      
      - name: 🔄 Merge pub to main
        run: |
          git fetch origin main
          git checkout main
          git merge origin/pub --no-ff -m "📝 New content from Siteleaf"
          git push origin main
      
      - name: ✅ Success notification
        if: success()
        run: |
          echo "✅ Content from Siteleaf successfully published to main"
          echo "🌐 Site will be deployed automatically"
      
      - name: ❌ Failure notification
        if: failure()
        run: |
          echo "❌ Failed to merge Siteleaf content"
          echo "⚠️ Manual intervention required"
          exit 1