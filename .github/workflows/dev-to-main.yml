name: Dev to Main (via PR)

on:
  push:
    branches:
      - dev

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout dev branch
        uses: actions/checkout@v4
        with:
          ref: dev
      
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      
      - name: Check Gemfile
        run: |
          if [ ! -f Gemfile ]; then
            echo "Gemfile not found!"
            exit 1
          fi
      
      - name: Install dependencies
        run: bundle install
      
      - name: Build Jekyll site
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production
      
      - name: Check build output
        run: |
          if [ ! -d "_site" ]; then
            echo "Build directory _site not found!"
            exit 1
          fi
          echo "✅ Jekyll site built successfully"

  create-pull-request:
    needs: test-and-build
    runs-on: ubuntu-latest
    if: success()
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Check if PR already exists
        id: check_pr
        run: |
          PR_EXISTS=$(gh pr list --base main --head dev --state open --json number --jq length)
          echo "pr_exists=$PR_EXISTS" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Create or update Pull Request
        if: steps.check_pr.outputs.pr_exists == '0'
        run: |
          git checkout main
          git merge origin/dev --no-ff -m "Auto-merge: dev to main (checks passed ✅)"
          git push origin main
      
      - name: Notify on success
        if: success()
        run: echo "✅ Dev branch successfully merged to main after passing checks"