name: Jekyll Tests

on:
  pull_request:
    branches:
      - main
      - dev
  push:
    branches:
      - dev

jobs:
  jekyll-build-test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
          bundler-cache: true
      
      - name: Install dependencies
        run: bundle install
      
      # Проверка конфигурации Jekyll
      - name: Check Jekyll config
        run: |
          if [ ! -f _config.yml ]; then
            echo "⚠️ _config.yml not found"
            exit 1
          fi
          echo "✅ Jekyll config found"
      
      # Сборка сайта
      - name: Build site
        run: bundle exec jekyll build --verbose
        env:
          JEKYLL_ENV: production
      
      # Проверка структуры
      - name: Check build structure
        run: |
          echo "Checking _site directory..."
          ls -la _site/
          
          # Проверка что есть index.html
          if [ ! -f _site/index.html ]; then
            echo "❌ index.html not found in _site"
            exit 1
          fi
          echo "✅ index.html exists"
      
      # Проверка размера сайта
      - name: Check site size
        run: |
          SITE_SIZE=$(du -sh _site | cut -f1)
          echo "📦 Site size: $SITE_SIZE"
      
      # HTML Proofer - проверка ссылок и HTML
      - name: Test HTML with HTMLProofer
        run: |
          gem install html-proofer
          htmlproofer ./_site \
            --disable-external \
            --allow-hash-href \
            --ignore-urls "/^http:\/\/127/,/^http:\/\/0.0.0.0/,/^http:\/\/localhost/" \
            --ignore-files "/assets/"
        continue-on-error: true
      
      # Проверка Markdown файлов
      - name: Lint Markdown files
        run: |
          gem install mdl
          mdl _posts/ --style .mdl_style.rb
        continue-on-error: true

  security-check:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
      
      # Проверка безопасности зависимостей
      - name: Security audit
        run: |
          gem install bundler-audit
          bundle audit check --update
        continue-on-error: true