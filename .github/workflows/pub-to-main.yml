name: Pub to Main (auto-merge content)

on:
  push:
    branches:
      - pub

jobs:
  auto-merge-content:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Configure Git
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
      
      - name: Merge pub to main
        run: |
          git checkout main
          git merge origin/pub --no-ff -m "Auto-merge: New content from Siteleaf (pub branch)"
          git push origin main
      
      - name: Notify on success
        if: success()
        run: echo "✅ Content from pub branch successfully merged to main"
      
      - name: Notify on failure
        if: failure()
        run: |
          echo "❌ Failed to merge pub to main - manual intervention needed"
          exit 1